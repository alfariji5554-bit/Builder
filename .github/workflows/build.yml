nama: Membangun APK Flutter

pada:
  workflow_dispatch:
    input:
      zip_url:
        deskripsi: "URL untuk mengunduh proyek ZIP Flutter"
        required: true
      tag:
        deskripsi: "Pembuatan tag"
        required: true
      build_type:
        deskripsi: "debug / rilis"
        required: true
        default: "release"
      only_analyze:
        deskripsi: "Hanya jalankan analisa (benar/salah)"
        required: false
        default: "false"

pekerjaan:
  build:
    berjalan di: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    langkah-langkah:
      - nama: Pengaturan Node.js
        uses: actions/setup-node@v4
        dengan:
          versi node: "24"

      - nama: Unduh proyek ZIP
        jalankan: |
          echo "=== Mengunduh ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          curl -L \
            -H "Otorisasi: Pemegang ${{ secrets.GH_TOKEN }}" \
            -H "Terima: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\n=== Status HTTP: %{http_code} ===\n=== URL Akhir: %{url_effective} ===\n"

          echo ""
          echo "=== Informasi File ==="
          ls -lh project.zip
          echo ""
          echo "=== Jenis File ==="
          file project.zip
          echo ""
          echo "=== Byte Pertama ==="
          proyek xxd.zip | kepala -2

      - nama: Ekstrak ZIP
        jalankan: |
          echo "=== Memvalidasi ZIP ==="
          jika ! unzip -t project.zip > /dev/null 2>&1; maka
            echo "❌ File bukan ZIP valid!"
            echo ""
            echo "=== File Isi ==="
            cat project.zip
            keluar 1
          fi
          echo "✅ Kode pos valid"

          echo ""
          echo "=== Mengekstrak ZIP ==="
          unzip -q project.zip -d project_raw

          echo ""
          echo "=== Mengunci Dir Proyek ==="
          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          JUMLAH_FILE=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          
          jika [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; maka
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          lainnya
            PROJECT_DIR="project_raw"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - nama: Pengaturan Java
        uses: actions/setup-java@v4
        dengan:
          distribusi: "temurin"
          java-version: "17"

      - nama: Pengaturan Flutter
        uses: subosito/flutter-action@main
        dengan:
          Versi Flutter: "3.41.9"
          saluran: "stabil"
          cache: true

      - nama: Analisis Kode Proyek
        direktori kerja: ${{ env.PROJECT_DIR }}
        jalankan: |
          jika [ -f "pubspec.yaml" ]; maka
            flutter analyze > analyze_report.txt 2>&1 || true
            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"
            rm -f analyze_report.txt
          lainnya
            echo "[RESULT_ANALYZE]"
            echo "❌ pubspec.yaml tidak ditemukan."
            echo "[END_RESULT_ANALYZE]"
          fi

      - nama: Berhenti jika Hanya Analisis
        jika: ${{ github.event.inputs.only_analyze == 'true' }}
        jalankan: keluar 1

      - nama: Dapatkan dependensi
        direktori kerja: ${{ env.PROJECT_DIR }}
        jalankan: |
          jika [ -f "pubspec.yaml" ]; maka
            timeout 120s flutter pub get || echo "⚠️ Lanjut..."
          fi

      - nama: Buat APK
        direktori kerja: ${{ env.PROJECT_DIR }}
        jalankan: |
          jika [ -f "pubspec.yaml" ]; maka
            flutter build apk --release --${{ github.event.inputs.build_type }} --tree-shake-icons --split-debug-info=build/symbols --obfuscate --target-platform=android-arm,android-arm64
          lainnya
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR" && chmod +x gradlew
            jika [ "${{ github.event.inputs.build_type }}" = "debug" ]; maka
              ./gradlew assembleDebug
            lainnya
              ./gradlew assembleRelease
            fi
          fi

      - nama: Periksa Output APK
        jalankan: |
          APK_DITEMUKAN=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)
          APK_PATH=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - nama: Unggah artefak APK
        uses: actions/upload-artifact@v4
        dengan:
          nama: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          jalur: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          Hari retensi: 1
          jika tidak ada file ditemukan: kesalahan
