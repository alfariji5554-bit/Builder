# yaml | .github/workflows/build.yml | GitHub Actions Ubuntu runner | Flutter Android APK
name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
        type: string
      tag:
        description: "Tag build"
        required: true
        type: string
        default: "latest"
      build_type:
        description: "Jenis build"
        required: true
        type: choice
        options:
          - debug
          - release
        default: release
      only_analyze:
        description: "Hanya jalankan flutter analyze"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ZIP_URL: ${{ inputs.zip_url }}
      BUILD_TYPE: ${{ inputs.build_type }}
      BUILD_TAG: ${{ inputs.tag }}
      ONLY_ANALYZE: ${{ inputs.only_analyze }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Download ZIP project
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Downloading Flutter project ==="
          if [[ -z "${ZIP_URL}" ]]; then
            echo "::error::zip_url kosong."
            exit 1
          fi

          CURL_ARGS=(--fail --location --silent --show-error --retry 3 --retry-delay 2)
          if [[ -n "${GH_TOKEN}" ]]; then
            CURL_ARGS+=(--header "Authorization: Bearer ${GH_TOKEN}")
          fi
          curl "${CURL_ARGS[@]}" \
            --header "Accept: application/octet-stream" \
            "${ZIP_URL}" \
            --output project.zip

          if [[ ! -s project.zip ]]; then
            echo "::error::File ZIP kosong atau gagal diunduh."
            exit 1
          fi
          file project.zip
          ls -lh project.zip
          unzip -tq project.zip

      - name: Extract project
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project_raw
          unzip -q project.zip -d project_raw

          mapfile -t top_dirs < <(find project_raw -mindepth 1 -maxdepth 1 -type d -print)
          mapfile -t top_files < <(find project_raw -mindepth 1 -maxdepth 1 -type f -print)

          if [[ ${#top_dirs[@]} -eq 1 && ${#top_files[@]} -eq 0 ]]; then
            project_dir="${top_dirs[0]}"
          else
            project_dir="project_raw"
          fi

          if [[ ! -f "${project_dir}/pubspec.yaml" && ! -f "${project_dir}/gradlew" ]]; then
            echo "::error::pubspec.yaml atau gradlew tidak ditemukan pada root project ZIP."
            find project_raw -maxdepth 3 -type f | head -80
            exit 1
          fi

          echo "project_dir=${project_dir}" >> "${GITHUB_OUTPUT}"
          echo "PROJECT_DIR=${project_dir}" >> "${GITHUB_ENV}"

      - name: Analyze Flutter project
        if: ${{ hashFiles('project_raw/**/pubspec.yaml') != '' }}
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get
          flutter analyze

      - name: Stop after analysis
        if: ${{ inputs.only_analyze }}
        shell: bash
        run: |
          echo "Analisis selesai sesuai pilihan only_analyze."
          exit 0

      - name: Build APK
        if: ${{ !inputs.only_analyze }}
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pubspec.yaml ]]; then
            flutter pub get
            flutter build apk "--${BUILD_TYPE}"
          elif [[ -f gradlew ]]; then
            chmod +x gradlew
            if [[ "${BUILD_TYPE}" == "debug" ]]; then
              ./gradlew assembleDebug
            else
              ./gradlew assembleRelease
            fi
          else
            echo "::error::Project bukan Flutter/Gradle Android yang dikenali."
            exit 1
          fi

      - name: Locate APK
        if: ${{ !inputs.only_analyze }}
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find "${PROJECT_DIR}" -type f -name '*.apk' -print -quit)"
          if [[ -z "${apk_path}" ]]; then
            echo "::error::Build selesai tetapi file APK tidak ditemukan."
            exit 1
          fi
          echo "path=${apk_path}" >> "${GITHUB_OUTPUT}"
          echo "APK ditemukan: ${apk_path}"

      - name: Upload APK artifact
        if: ${{ !inputs.only_analyze }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ inputs.build_type }}-${{ inputs.tag }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
